<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexZone | Invoice</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="EliteAdmin - Bootstrap Admin Template">
    <meta name="keywords" content="admin, dashboard">

    <link href="assets/images/logo/favicon.ico" rel="icon">
    <link href="https://bootstrapmade.com/content/demo/EliteAdmin/assets/img/apple-touch-icon.png"
          rel="apple-touch-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap"
          rel="stylesheet">

    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin/remixicon.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/admin/all.min.css" rel="stylesheet">
    <link href="assets/css/admin/phosphor-icons.css" rel="stylesheet">
    <link href="https://bootstrapmade.com/content/vendors/lucide-icons/lucide.css" rel="stylesheet">
    <link href="https://bootstrapmade.com/content/vendors/simple-datatables/style.css" rel="stylesheet">
    <link href="https://bootstrapmade.com/content/vendors/quill/quill.snow.css" rel="stylesheet">

    <link href="assets/css/admin/admin-main.css" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">

    <script>
        fetch("admin-sidebar.html").then(response => response.text())
            .then(data => {
                document.getElementById("sidebar").innerHTML = data;
            });
    </script>
    <style>
        .main {
            display: none;
        }
    </style>

</head>
<body>

<div id="sidebar"></div>

<main class="main">
    <div class="main-content page-invoice-list">
        <div class="page-header">
            <div>
                <h1 class="page-title">Invoices</h1>
                <nav class="breadcrumb">
                    <a href="https://bootstrapmade.com/content/demo/EliteAdmin/index.html"
                       class="breadcrumb-item">Home</a>
                    <span class="breadcrumb-item active">Invoices</span>
                </nav>
            </div>
        </div>

        <!-- Stats -->
        <div class="row g-3 mb-4">
            <div class="col-sm-6 col-xl-3">
                <div class="card inv-stat-card">
                    <div class="card-body">
                        <div class="inv-stat-icon"
                             style="background: color-mix(in srgb, var(--accent-color), transparent 90%); color: var(--accent-color);">
                            <i class="bi bi-receipt"></i>
                        </div>
                        <div class="inv-stat-info">
                            <span class="inv-stat-value" id="totalInvoices">-</span>
                            <span class="inv-stat-label">Total Invoices</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card inv-stat-card">
                    <div class="card-body">
                        <div class="inv-stat-icon"
                             style="background: var(--success-color-light); color: var(--success-color);">
                            <i class="bi bi-check-circle"></i>
                        </div>
                        <div class="inv-stat-info">
                            <span class="inv-stat-value" id="totalPaid">-</span>
                            <span class="inv-stat-label">Paid</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card inv-stat-card">
                    <div class="card-body">
                        <div class="inv-stat-icon"
                             style="background: var(--warning-color-light); color: var(--warning-color);">
                            <i class="bi bi-clock"></i>
                        </div>
                        <div class="inv-stat-info">
                            <span class="inv-stat-value" id="totalPending">-</span>
                            <span class="inv-stat-label">Pending</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-sm-6 col-xl-3">
                <div class="card inv-stat-card">
                    <div class="card-body">
                        <div class="inv-stat-icon"
                             style="background: var(--danger-color-light); color: var(--danger-color);">
                            <i class="bi bi-gift-fill"></i>
                        </div>
                        <div class="inv-stat-info">
                            <span class="inv-stat-value" id="totalDeliveredItems">-</span>
                            <span class="inv-stat-label">Delivered Items</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Invoice Table -->
        <div class="card">
            <div class="card-header">
                <h5 class="card-title mb-0">All Invoices</h5>
                <div class="inv-toolbar">
                    <div class="inv-search">
                        <i class="bi bi-search"></i>
                        <input type="text" placeholder="Search invoices...">
                    </div>
                    <select class="inv-filter">
                        <option value="all">All Status</option>
                        <optgroup label="Payment">
                            <option value="paid">Paid</option>
                            <option value="pending">Pending</option>
                        </optgroup>
                        <optgroup label="Delivery">
                            <option value="approved">Approved</option>
                            <option value="packing">Packing</option>
                            <option value="shipped">Shipped</option>
                            <option value="delivered">Delivered</option>
                            <option value="completed">Completed</option>
                            <option value="canceled">Canceled</option>
                        </optgroup>
                    </select>
                </div>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                        <tr>
                            <th>Invoice</th>
                            <th>Client</th>
                            <th>Amount</th>
                            <th></th>
                            <th>Purchased</th>
                            <th>Updated</th>
                            <th>Status</th>
                            <th class="inv-th-actions">Actions</th>
                        </tr>
                        </thead>
                        <tbody id="invoiceContainer">

                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="inv-pagination">
                    <span class="inv-pagination-info">Showing 1 to 7 of 248 invoices</span>
                    <nav>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item disabled"><a class="page-link" href="#"><i
                                    class="bi bi-chevron-left"></i></a></li>
                            <li class="page-item active"><a class="page-link" href="#">1</a></li>
                            <li class="page-item"><a class="page-link" href="#">2</a></li>
                            <li class="page-item"><a class="page-link" href="#">3</a></li>
                            <li class="page-item"><a class="page-link" href="#">...</a></li>
                            <li class="page-item"><a class="page-link" href="#">36</a></li>
                            <li class="page-item"><a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-links">
                <a href="#">About</a>
                <span class="footer-separator"></span>
                <a href="#">Privacy</a>
                <span class="footer-separator"></span>
                <a href="#">Terms</a>
                <span class="footer-separator"></span>
                <a href="#">Contact</a>
            </div>
            <div class="footer-copyright">
                <div class="credits">
                    &copy; 2026 Copyright fleXZone. All Rights Reserved.
                </div>
            </div>
        </div>
    </footer>
</main>

<!-- Back to Top -->
<a href="#" class="back-to-top">
    <i class="bi bi-arrow-up"></i>
</a>

<script src="https://bootstrapmade.com/content/demo/EliteAdmin/assets/js/theme.js"></script>

</body>
</html>
