    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.getElementById("footer").innerHTML = data;
            });

<body onload="loadCartCards();">
<div id="header"></div>


<main class="main">

    <!-- Page Title -->
    <div class="page-title light-background">
        <div class="container d-lg-flex justify-content-between align-items-center">
            <h1 class="mb-2 mb-lg-0">Cart</h1>
            <nav class="breadcrumbs">
                <ol>
                    <li><a href="index.html">Home</a></li>
                    <li class="current">Cart</li>
                </ol>
            </nav>
        </div>
    </div><!-- End Page Title -->

    <!-- Cart Section -->
    <section id="cart" class="cart section">

        <div class="container" data-aos="fade-up" data-aos-delay="100">

            <div class="row g-4">
                <div class="col-lg-8" data-aos="fade-up" data-aos-delay="200">
                    <div class="cart-items">
                        <div class="cart-header d-none d-lg-block">
                            <div class="row align-items-center gy-4">
                                <div class="col-lg-6">
                                    <h5>Product</h5>
                                </div>
                                <div class="col-lg-2 text-center">
                                    <h5>Price</h5>
                                </div>
                                <div class="col-lg-2 text-center">
                                    <h5>Quantity</h5>
                                </div>
                                <div class="col-lg-2 text-center">
                                    <h5>Total</h5>
                                </div>
                            </div>
                        </div>

                        <div id="cartTableBody">

                            <!-- Cart Body -->

                        </div>

                        <div class="cart-actions">
                            <div class="row g-3">
                                <div class="col-lg-6 col-md-6">
                                    <div class="coupon-form">
                                        <div class="input-group">
                                            <input type="text" class="form-control" placeholder="Coupon code">
                                            <button class="btn btn-accent" type="button">Apply</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-lg-6 col-md-6 text-md-end">
                                    <button class="btn btn-outline-accent me-2" onclick="loadCartCards(); loadCartCount();">
                                        <i class="bi bi-arrow-clockwise"></i> Update
                                    </button>
<!--                                    <button class="btn btn-outline-danger">-->
<!--                                        <i class="bi bi-trash"></i> Clear-->
<!--                                    </button>-->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4" data-aos="fade-up" data-aos-delay="300">
                    <div class="cart-summary">
                        <h4 class="summary-title">Order Summary</h4>

                        <div class="summary-item">
                            <span class="summary-label">Subtotal</span>
                            <span class="summary-value" id="summarySubtotal">Rs.0.00</span>
                        </div>

                        <div class="summary-item shipping-item">
                            <span class="summary-label">Shipping</span>
                            <div class="shipping-options" id="shippingOptions">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="shipping" id="standard" checked="">
                                    <label class="form-check-label" for="standard">
                                        Standard Delivery - Rs.450.00
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="shipping" id="express">
                                    <label class="form-check-label" for="express">
                                        Express Delivery - Rs.800.00
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="shipping" id="free">
                                    <label class="form-check-label" for="free">
                                        Free Shipping (Orders over Rs.5000.00)
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="summary-item">
                            <span class="summary-label">Tax</span>
                            <span class="summary-value" id="summaryTax">Rs.0.00</span>
                        </div>

                        <div class="summary-item discount">
                            <span class="summary-label">Discount</span>
                            <span class="summary-value" id="summaryDiscount">-Rs.0.00</span>
                        </div>

                        <div class="summary-total">
                            <span class="summary-label">Grand Total</span>
                            <span class="summary-value" id="summaryTotal">Rs.11,999.00</span>
                        </div>

                        <div class="checkout-button">
                            <a href="checkout.html" class="btn btn-accent w-100">
                                Proceed to Checkout <i class="bi bi-arrow-right"></i>
                            </a>
                        </div>

                        <div class="continue-shopping">
                            <a href="index.html" class="btn btn-link w-100">
                                <i class="bi bi-arrow-left"></i> Continue Shopping
                            </a>
                        </div>

                        <div class="payment-methods">
                            <p class="payment-title">We Accept</p>
                            <div class="payment-icons">
                                <i class="bi bi-credit-card-2-front"></i>
                                <i class="bi bi-paypal"></i>
                                <i class="bi bi-wallet2"></i>
                                <i class="bi bi-apple"></i>
                                <i class="bi bi-google"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </section><!-- /Cart Section -->

</main>



<div id="footer"></div>
