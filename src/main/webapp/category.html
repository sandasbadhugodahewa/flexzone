<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Category - fleXZone</title>
    <meta name="description" content="">
    <meta name="robots" content="noindex, nofollow">

    <!-- Favicons -->
    <link href="https://bootstrapmade.com/content/demo/eStore/assets/img/favicon.png" rel="icon">
    <link href="https://bootstrapmade.com/content/demo/eStore/assets/img/apple-touch-icon.png" rel="apple-touch-icon">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/" rel="preconnect">
    <link href="https://fonts.gstatic.com/" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Vendor CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/swiper-bundle.min.css" rel="stylesheet">
    <link href="assets/css/aos.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script>
        fetch("header.html")
            .then(r => r.text())
            .then(d => { document.getElementById("header").innerHTML = d; });
        fetch("footer.html")
            .then(r => r.text())
            .then(d => { document.getElementById("footer").innerHTML = d; });
    </script>

    <style>
        /* ── Sidebar ── */
        .category-sidebar {
            position: sticky;
            top: 90px;
        }

        .filter-card {
            background: #fff;
            border: 1px solid color-mix(in srgb, var(--accent-color), transparent 88%);
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 18px;
        }

        .filter-card h6 {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.7px;
            color: var(--accent-color);
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid color-mix(in srgb, var(--accent-color), transparent 88%);
        }

        /* Category list */
        .category-list { list-style: none; padding: 0; margin: 0; }
        .category-list li { margin-bottom: 4px; }
        .category-list li a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: var(--default-color);
            text-decoration: none;
            transition: all 0.2s;
        }
        .category-list li a:hover,
        .category-list li a.active {
            background: color-mix(in srgb, var(--accent-color), transparent 90%);
            color: var(--accent-color);
            font-weight: 600;
        }
        .category-list li a .count {
            font-size: 11px;
            background: color-mix(in srgb, var(--accent-color), transparent 88%);
            color: var(--accent-color);
            padding: 2px 7px;
            border-radius: 999px;
            font-weight: 600;
        }
        .category-list li a.active .count {
            background: var(--accent-color);
            color: #fff;
        }

        /* Size filter */
        .size-filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .size-btn {
            padding: 5px 14px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            border: 1.5px solid color-mix(in srgb, var(--accent-color), transparent 75%);
            color: var(--default-color);
            background: transparent;
            cursor: pointer;
            transition: all 0.2s;
        }
        .size-btn:hover, .size-btn.active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* Price range */
        .price-range-display {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            margin-bottom: 8px;
        }
        .price-slider {
            width: 100%;
            accent-color: var(--accent-color);
        }

        /* Color filter */
        .color-filters { display: flex; flex-wrap: wrap; gap: 8px; }
        .color-dot {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }
        .color-dot:hover { transform: scale(1.15); }
        .color-dot.active {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent-color);
        }

        /* ── Toolbar ── */
        .products-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            padding: 14px 18px;
            background: #fff;
            border: 1px solid color-mix(in srgb, var(--accent-color), transparent 88%);
            border-radius: 12px;
            margin-bottom: 24px;
        }

        .toolbar-left {
            font-size: 14px;
            color: color-mix(in srgb, var(--default-color), transparent 35%);
        }

        .toolbar-left strong { color: var(--heading-color); }

        .toolbar-right { display: flex; gap: 10px; align-items: center; }

        .sort-select {
            padding: 7px 14px;
            border-radius: 8px;
            border: 1.5px solid color-mix(in srgb, var(--accent-color), transparent 75%);
            font-size: 13px;
            color: var(--default-color);
            background: #fff;
            cursor: pointer;
            outline: none;
        }

        .sort-select:focus { border-color: var(--accent-color); }

        .view-btn {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            border: 1.5px solid color-mix(in srgb, var(--accent-color), transparent 75%);
            background: transparent;
            color: var(--default-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 15px;
        }

        .view-btn.active,
        .view-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
        }

        /* ── Product Grid ── */
        #productGrid.list-view .product-col {
            flex: 0 0 100%;
            max-width: 100%;
        }

        #productGrid.list-view .product-card {
            flex-direction: row;
            align-items: center;
        }

        #productGrid.list-view .product-image {
            width: 200px;
            flex-shrink: 0;
            height: 180px;
        }

        #productGrid.list-view .product-image img {
            height: 100%;
            object-fit: cover;
        }

        #productGrid.list-view .product-info {
            padding: 16px 20px;
            flex: 1;
        }

        #productGrid.list-view .product-actions-bar {
            margin-top: 12px;
        }

        /* Active filter tags */
        .active-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .filter-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            background: color-mix(in srgb, var(--accent-color), transparent 90%);
            color: var(--accent-color);
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }

        .filter-tag button {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            padding: 0;
            font-size: 12px;
            line-height: 1;
        }

        /* No results */
        .no-results {
            text-align: center;
            padding: 60px 20px;
        }

        .no-results .icon-wrap {
            width: 80px;
            height: 80px;
            background: color-mix(in srgb, var(--accent-color), transparent 90%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }

        /* Pagination */
        .pagination .page-link {
            color: var(--accent-color);
            border-color: color-mix(in srgb, var(--accent-color), transparent 80%);
            border-radius: 8px !important;
            margin: 0 3px;
            font-weight: 600;
            font-size: 14px;
        }

        .pagination .page-item.active .page-link {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
        }

        /* Mobile filter drawer */
        .filter-drawer-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1040;
        }

        .filter-drawer {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100%;
            background: #fff;
            z-index: 1050;
            overflow-y: auto;
            padding: 20px;
            transition: left 0.3s ease;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
        }

        .filter-drawer.open { left: 0; }
        .filter-drawer-overlay.open { display: block; }

        @media (max-width: 991px) {
            .sidebar-desktop { display: none; }
        }

        @media (min-width: 992px) {
            .filter-mobile-btn { display: none; }
        }
    </style>
</head>

<body onload="initCategoryPage();">
<div id="header"></div>

<main class="main">

    <!-- Page Title -->
    <div class="page-title light-background">
        <div class="container d-lg-flex justify-content-between align-items-center">
            <h1 class="mb-2 mb-lg-0" id="pageTitleText">Category</h1>
            <nav class="breadcrumbs">
                <ol>
                    <li><a href="index.html">Home</a></li>
                    <li class="current" id="breadcrumbCat">Products</li>
                </ol>
            </nav>
        </div>
    </div>

    <!-- Category Section -->
    <section class="section" style="padding: 40px 0 60px;">
        <div class="container">
            <div class="row g-4">

                <!-- ── SIDEBAR (desktop) ── -->
                <div class="col-lg-3 sidebar-desktop">
                    <div class="category-sidebar" id="sidebarContent">
                        <!-- filled by JS -->
                    </div>
                </div>

                <!-- ── MAIN CONTENT ── -->
                <div class="col-lg-9">

                    <!-- Mobile filter button -->
                    <button class="btn btn-outline-primary btn-sm mb-3 filter-mobile-btn"
                            onclick="openFilterDrawer()">
                        <i class="bi bi-funnel me-2"></i>Filters
                    </button>

                    <!-- Active filter tags -->
                    <div class="active-filters" id="activeFilters"></div>

                    <!-- Toolbar -->
                    <div class="products-toolbar">
                        <div class="toolbar-left">
                            Showing <strong id="productCount">0</strong> products
                            <span id="categoryLabel"></span>
                        </div>
                        <div class="toolbar-right">
                            <select class="sort-select" id="sortSelect" onchange="sortProducts()">
                                <option value="default">Default</option>
                                <option value="price-asc">Price: Low to High</option>
                                <option value="price-desc">Price: High to Low</option>
                                <option value="name-asc">Name: A–Z</option>
                                <option value="name-desc">Name: Z–A</option>
                            </select>
                            <button class="view-btn active" id="gridViewBtn" onclick="setView('grid')" title="Grid view">
                                <i class="bi bi-grid"></i>
                            </button>
                            <button class="view-btn" id="listViewBtn" onclick="setView('list')" title="List view">
                                <i class="bi bi-list-ul"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Products Grid -->
                    <div class="row g-3" id="productGrid">
                        <!-- skeleton -->
                        ${[1,2,3,4,6,8].map(() => `
                        <div class="col-md-6 col-lg-4 product-col">
                            <div style="height:320px; border-radius:14px;
                                        background:linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);
                                        background-size:200% 100%;
                                        animation:shimmer 1.4s infinite;"></div>
                        </div>`).join("")}
                    </div>

                    <!-- Pagination -->
                    <nav class="mt-5 d-flex justify-content-center" id="paginationNav" style="display:none!important;">
                        <ul class="pagination" id="pagination"></ul>
                    </nav>

                </div>
            </div>
        </div>
    </section>

</main>

<!-- ── MOBILE FILTER DRAWER ── -->
<div class="filter-drawer-overlay" id="filterOverlay" onclick="closeFilterDrawer()"></div>
<div class="filter-drawer" id="filterDrawer">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Filters</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="closeFilterDrawer()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    <div id="drawerContent"></div>
</div>

<div id="footer"></div>

<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
</a>
<div id="preloader"></div>

<!-- Vendor JS -->
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/vendor/aos.js"></script>
<script src="assets/js/vendor/swiper-bundle.min.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/vendor/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/wishlist.js"></script>

<style>
    @keyframes shimmer {
        0%   { background-position: -200% 0; }
        100% { background-position:  200% 0; }
    }
</style>

<script>
    // ─────────────────────────────────────────────
    //  STATE
    // ─────────────────────────────────────────────
    const DISCOUNT_PERCENT = 10;

    let allProducts      = [];   // raw from API
    let filteredProducts = [];   // after filters
    let allCategories    = [];
    let allSizes         = [];

    let currentCategoryId  = null;
    let currentCategoryName = "All Products";
    let selectedSizes      = [];
    let selectedColors     = [];
    let maxPrice           = 99999;
    let currentView        = "grid";
    let currentPage        = 1;
    const PAGE_SIZE        = 12;

    // ─────────────────────────────────────────────
    //  INIT
    // ─────────────────────────────────────────────
    async function initCategoryPage() {
        const params = new URLSearchParams(window.location.search);
        const catId  = params.get("cId");
        const catName = params.get("cName") || "All Products";

        currentCategoryId   = catId ? parseInt(catId) : null;
        currentCategoryName = decodeURIComponent(catName);

        // Update page title and breadcrumb
        document.getElementById("pageTitleText").textContent  = currentCategoryName;
        document.getElementById("breadcrumbCat").textContent  = currentCategoryName;
        document.getElementById("categoryLabel").innerHTML    =
            currentCategoryName !== "All Products"
                ? ` in <strong>${currentCategoryName}</strong>` : "";
        document.title = `${currentCategoryName} - fleXZone`;

        await Promise.all([loadCategories(), loadProducts()]);
    }

    // ─────────────────────────────────────────────
    //  LOAD CATEGORIES (for sidebar list)
    // ─────────────────────────────────────────────
    async function loadCategories() {
        try {
            const res  = await fetch("api/header/loadCategories");
            const data = await res.json();
            if (data.status) {
                allCategories = data.categories;
                buildSidebar();
            }
        } catch (e) {
            console.error("Categories load failed:", e);
        }
    }

    // ─────────────────────────────────────────────
    //  LOAD PRODUCTS
    // ─────────────────────────────────────────────
    async function loadProducts() {
        try {
            const url = currentCategoryId
                ? `api/products/loadProducts?cId=${currentCategoryId}`
                : `api/products/loadProducts`;

            const res  = await fetch(url);
            const data = await res.json();

            if (data.status && data.products) {
                allProducts = data.products;

                // Collect unique sizes for filter
                const sizeSet = new Set();
                allProducts.forEach(p => {
                    (p.stockDTOList || []).forEach(s => {
                        if (s.sizeValue) sizeSet.add(s.sizeValue);
                    });
                });
                allSizes = [...sizeSet].sort();

                applyFilters();
                buildSidebar(); // rebuild with counts
            } else {
                showNoResults();
            }
        } catch (e) {
            Notiflix.Notify.failure("Failed to load products!", { position: "center-top" });
            showNoResults();
        }
    }

    // ─────────────────────────────────────────────
    //  APPLY FILTERS + SORT + RENDER
    // ─────────────────────────────────────────────
    function applyFilters() {
        filteredProducts = allProducts.filter(p => {
            // Size filter
            if (selectedSizes.length > 0) {
                const productSizes = (p.stockDTOList || []).map(s => s.sizeValue);
                if (!selectedSizes.some(s => productSizes.includes(s))) return false;
            }
            // Price filter
            if (p.price > maxPrice) return false;

            return true;
        });

        sortProducts(false); // sort without re-filtering
        updateActiveFilterTags();
        currentPage = 1;
        renderPage();
    }

    function sortProducts(reRender = true) {
        const sort = document.getElementById("sortSelect")?.value || "default";
        filteredProducts.sort((a, b) => {
            if (sort === "price-asc")  return a.price - b.price;
            if (sort === "price-desc") return b.price - a.price;
            if (sort === "name-asc")   return a.title.localeCompare(b.title);
            if (sort === "name-desc")  return b.title.localeCompare(a.title);
            return 0;
        });
        if (reRender) renderPage();
    }

    // ─────────────────────────────────────────────
    //  RENDER CURRENT PAGE
    // ─────────────────────────────────────────────
    function renderPage() {
        const grid = document.getElementById("productGrid");
        document.getElementById("productCount").textContent = filteredProducts.length;

        if (filteredProducts.length === 0) {
            showNoResults();
            return;
        }

        const start    = (currentPage - 1) * PAGE_SIZE;
        const pageData = filteredProducts.slice(start, start + PAGE_SIZE);

        grid.className = `row g-3${currentView === "list" ? " list-view" : ""}`;
        grid.innerHTML = pageData.map((p, i) => buildProductCard(p, i)).join("");

        renderPagination();
    }

    // ─────────────────────────────────────────────
    //  BUILD PRODUCT CARD
    // ─────────────────────────────────────────────
    function buildProductCard(product, index) {
        const image = product.images && product.images.length > 0
            ? "assets/images/" + product.images[0]
            : "assets/images/default.png";

        const image2 = product.images && product.images.length > 1
            ? "assets/images/" + product.images[1]
            : image;

        const discountAmount = product.price * (DISCOUNT_PERCENT / 100);
        const oldPrice       = (product.price + discountAmount).toFixed(2);

        const firstStock = (product.stockDTOList || []).find(s => s.quantity > 0)
            || (product.stockDTOList || [])[0];
        const stockId    = firstStock ? firstStock.stockId : null;

        const colClass = currentView === "list"
            ? "col-12 product-col"
            : "col-md-6 col-lg-4 product-col";

        return `
    <div class="${colClass}" data-aos="fade-up" data-aos-delay="${(index % 3) * 100}">
        <div class="product-card" style="${currentView === "list" ? "display:flex;" : ""}">
            <div class="product-image" style="${currentView === "list" ? "width:200px;flex-shrink:0;" : ""}">
                <img src="${image}"  alt="${product.title}"
                     class="img-fluid default-image" loading="lazy">
                <img src="${image2}" alt="${product.title}"
                     class="img-fluid hover-image" loading="lazy">
                <div class="product-tags">
                    <span class="badge bg-accent">New</span>
                </div>
                <div class="product-actions">
                    <button class="btn-wishlist" type="button"
                            onclick="addToWishList(${stockId})"
                            aria-label="Add to wishlist">
                        <i class="bi bi-heart"></i>
                    </button>
                    <a class="btn-quickview" href="single-product.html?pId=${product.id}"
                       aria-label="View product">
                        <i class="bi bi-eye"></i>
                    </a>
                </div>
            </div>
            <div class="product-info" style="${currentView === "list" ? "flex:1;" : ""}">
                <h3 class="product-title">
                    <a href="single-product.html?pId=${product.id}">${product.title}</a>
                </h3>
                <div class="product-price">
                    <span class="current-price">Rs.${product.price}.00</span>
                    <span class="original-price">Rs.${oldPrice}</span>
                </div>
                <div class="product-rating">
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-fill"></i>
                    <i class="bi bi-star-half"></i>
                    <span>(24)</span>
                </div>
                ${currentView === "list" ? `
                <div class="product-actions-bar mt-3" style="display:flex; gap:10px;">
                    <button onclick="addToCart(${stockId}, 1)"
                            class="btn btn-sm"
                            style="background:var(--accent-color); color:#fff; border:none;
                                   border-radius:8px; padding:8px 18px; font-weight:600; font-size:13px;">
                        <i class="bi bi-cart-plus me-1"></i>Add to Cart
                    </button>
                    <a href="single-product.html?pId=${product.id}"
                       class="btn btn-sm btn-outline-secondary" style="border-radius:8px; font-size:13px;">
                        View Details
                    </a>
                </div>` : ""}
            </div>
        </div>
    </div>`;
    }

    // ─────────────────────────────────────────────
    //  BUILD SIDEBAR
    // ─────────────────────────────────────────────
    function buildSidebar() {
        const html = buildFilterHTML();
        document.getElementById("sidebarContent").innerHTML  = html;
        document.getElementById("drawerContent").innerHTML   = html;

        // Set price slider max
        const prices = allProducts.map(p => p.price);
        const max    = prices.length ? Math.ceil(Math.max(...prices) / 1000) * 1000 : 10000;
        document.querySelectorAll(".price-slider").forEach(el => {
            el.max   = max;
            el.value = maxPrice === 99999 ? max : maxPrice;
            updatePriceDisplay(el);
        });
    }

    function buildFilterHTML() {
        // Categories list
        const catItems = allCategories.map(c => {
            const count   = allProducts.filter(p => p.categoryId === c.id).length;
            const isActive = currentCategoryId === c.id ? "active" : "";
            return `<li>
            <a href="category.html?cId=${c.id}&cName=${encodeURIComponent(c.name)}"
               class="${isActive}">
                ${c.name}
                <span class="count">${count}</span>
            </a>
        </li>`;
        }).join("");

        // Size buttons
        const sizeButtons = allSizes.map(s => `
        <button class="size-btn ${selectedSizes.includes(s) ? "active" : ""}"
                onclick="toggleSize('${s}', this)">${s}</button>`).join("");

        return `
        <!-- Categories -->
        <div class="filter-card">
            <h6>Categories</h6>
            <ul class="category-list">
                <li>
                    <a href="category.html" class="${!currentCategoryId ? "active" : ""}">
                        All Products
                        <span class="count">${allProducts.length}</span>
                    </a>
                </li>
                ${catItems}
            </ul>
        </div>

        <!-- Price Range -->
        <div class="filter-card">
            <h6>Price Range</h6>
            <div class="price-range-display">
                <span>Rs. 0</span>
                <span id="priceMaxDisplay_1">Rs. 10,000</span>
            </div>
            <input type="range" class="price-slider" min="0" max="10000"
                   oninput="updatePriceDisplay(this); filterByPrice(this.value)"
                   style="width:100%; accent-color:var(--accent-color);">
        </div>

        <!-- Sizes -->
        ${allSizes.length > 0 ? `
        <div class="filter-card">
            <h6>Sizes</h6>
            <div class="size-filters">${sizeButtons}</div>
        </div>` : ""}

        <!-- Clear filters -->
        <button onclick="clearAllFilters()"
                style="width:100%; padding:10px; border-radius:10px;
                       border:1.5px solid var(--accent-color); background:transparent;
                       color:var(--accent-color); font-weight:600; font-size:13px;
                       cursor:pointer; transition:all 0.2s;"
                onmouseenter="this.style.background='var(--accent-color)'; this.style.color='#fff'"
                onmouseleave="this.style.background='transparent'; this.style.color='var(--accent-color)'">
            <i class="bi bi-x-circle me-2"></i>Clear All Filters
        </button>`;
    }

    // ─────────────────────────────────────────────
    //  FILTER ACTIONS
    // ─────────────────────────────────────────────
    function toggleSize(size, btn) {
        if (selectedSizes.includes(size)) {
            selectedSizes = selectedSizes.filter(s => s !== size);
            btn.classList.remove("active");
        } else {
            selectedSizes.push(size);
            btn.classList.add("active");
        }
        // Sync both sidebar and drawer
        document.querySelectorAll(`.size-btn`).forEach(b => {
            b.classList.toggle("active", selectedSizes.includes(b.textContent.trim()));
        });
        applyFilters();
    }

    function filterByPrice(value) {
        maxPrice = parseInt(value);
        document.querySelectorAll("#priceMaxDisplay_1").forEach(el => {
            el.textContent = "Rs. " + parseInt(value).toLocaleString();
        });
        applyFilters();
    }

    function updatePriceDisplay(slider) {
        document.querySelectorAll("#priceMaxDisplay_1").forEach(el => {
            el.textContent = "Rs. " + parseInt(slider.value).toLocaleString();
        });
    }

    function clearAllFilters() {
        selectedSizes  = [];
        selectedColors = [];
        maxPrice       = 99999;
        buildSidebar();
        applyFilters();
    }

    function updateActiveFilterTags() {
        const container = document.getElementById("activeFilters");
        let tags = "";
        selectedSizes.forEach(s => {
            tags += `<span class="filter-tag">Size: ${s}
            <button onclick="removeSizeFilter('${s}')"><i class="bi bi-x"></i></button>
        </span>`;
        });
        if (maxPrice < 99999) {
            tags += `<span class="filter-tag">Max: Rs.${maxPrice.toLocaleString()}
            <button onclick="removePriceFilter()"><i class="bi bi-x"></i></button>
        </span>`;
        }
        container.innerHTML = tags;
    }

    function removeSizeFilter(size) {
        selectedSizes = selectedSizes.filter(s => s !== size);
        buildSidebar();
        applyFilters();
    }

    function removePriceFilter() {
        maxPrice = 99999;
        buildSidebar();
        applyFilters();
    }

    // ─────────────────────────────────────────────
    //  PAGINATION
    // ─────────────────────────────────────────────
    function renderPagination() {
        const totalPages = Math.ceil(filteredProducts.length / PAGE_SIZE);
        const nav        = document.getElementById("paginationNav");
        const ul         = document.getElementById("pagination");

        if (totalPages <= 1) {
            nav.style.display = "none";
            return;
        }

        nav.style.display = "flex";
        let html = `
        <li class="page-item ${currentPage === 1 ? "disabled" : ""}">
            <a class="page-link" onclick="goToPage(${currentPage - 1})">
                <i class="bi bi-chevron-left"></i>
            </a>
        </li>`;

        for (let i = 1; i <= totalPages; i++) {
            html += `<li class="page-item ${i === currentPage ? "active" : ""}">
            <a class="page-link" onclick="goToPage(${i})" style="cursor:pointer;">${i}</a>
        </li>`;
        }

        html += `
        <li class="page-item ${currentPage === totalPages ? "disabled" : ""}">
            <a class="page-link" onclick="goToPage(${currentPage + 1})">
                <i class="bi bi-chevron-right"></i>
            </a>
        </li>`;

        ul.innerHTML = html;
    }

    function goToPage(page) {
        const totalPages = Math.ceil(filteredProducts.length / PAGE_SIZE);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderPage();
        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ─────────────────────────────────────────────
    //  VIEW TOGGLE
    // ─────────────────────────────────────────────
    function setView(view) {
        currentView = view;
        document.getElementById("gridViewBtn").classList.toggle("active", view === "grid");
        document.getElementById("listViewBtn").classList.toggle("active", view === "list");
        renderPage();
    }

    // ─────────────────────────────────────────────
    //  NO RESULTS
    // ─────────────────────────────────────────────
    function showNoResults() {
        document.getElementById("productCount").textContent = 0;
        document.getElementById("productGrid").innerHTML = `
        <div class="col-12">
            <div class="no-results">
                <div class="icon-wrap">
                    <i class="bi bi-search" style="font-size:36px; color:var(--accent-color);"></i>
                </div>
                <h5 class="fw-bold mt-3 mb-2">No products found</h5>
                <p class="text-muted mb-4">Try adjusting your filters or browse another category.</p>
                <button onclick="clearAllFilters()"
                        style="background:var(--accent-color); color:#fff; border:none;
                               padding:10px 24px; border-radius:10px; font-weight:600;
                               font-size:14px; cursor:pointer;">
                    Clear Filters
                </button>
            </div>
        </div>`;
        document.getElementById("paginationNav").style.display = "none";
    }

    // ─────────────────────────────────────────────
    //  MOBILE DRAWER
    // ─────────────────────────────────────────────
    function openFilterDrawer() {
        document.getElementById("filterDrawer").classList.add("open");
        document.getElementById("filterOverlay").classList.add("open");
        document.body.style.overflow = "hidden";
    }

    function closeFilterDrawer() {
        document.getElementById("filterDrawer").classList.remove("open");
        document.getElementById("filterOverlay").classList.remove("open");
        document.body.style.overflow = "";
    }
</script>

</body>
</html>
