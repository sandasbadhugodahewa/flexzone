<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>Sign Up | Flex Zone</title>
    <meta name="robots" content="noindex, follow"/>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap-login-form.min.css">
    <link rel="stylesheet" href="assets/css/bootstrap.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href='https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css' rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"/>
</head>
<body>

<div class="container-fluid">
    <div class="row d-flex justify-content-center">

        <section>
            <div class="px-0 py-0 px-md-5 text-center text-lg-start" style="background-color: hsl(0, 0%, 96%);max-height: 790px;height: 100%;">
                <div class="container">
                    <div class="row gx-lg-5 align-items-center ">
                        <div class="col-lg-6 mb-1 mb-lg-2">
                            <h1 class="my-5 display-3 fw-bold ls-tight">
                                <span class="text-primary">fleX Zone</span><br>
                                The Best Offer <br/>
                                <span class="text-primary">For your online Shopping</span>
                            </h1>
                            <p style="color: hsl(217, 10%, 50.8%)">
                                Discover products you'll love with our personalized recommendations based on your
                                preferences.
                                Sign in in just a few clicks and start shopping with confidence!!
                            </p>
                        </div>


                        <div class="col-lg-6 mb-5 mb-lg-0">
                            <section class="container1 ms-0 ms-lg-4 me-0 me-lg-0">
                                <section class="container forms">
                                    <!-- Signup Form -->
                                    <div class="form col-lg-4 col-10 mt-lg-5" id="signUpBox">
                                        <div class="form-content">
                                            <header>Signup</header>

                                            <form class="singup-form">

                                                <div class="row">
                                                    <div class="col-md-6 mb-0">
                                                        <div class="field input-field">
                                                            <input type="text" placeholder="First Name" class="input" id="firstName"/>
                                                        </div>
                                                    </div>
                                                    <div class="col-md-6 mb-0">
                                                        <div class="field input-field">
                                                            <input type="text" placeholder="Last Name" class="input" id="lastName"/>
                                                        </div>
                                                    </div>
                                                </div>

                                                <div class="field input-field">
                                                    <input type="email" placeholder="Email" class="input" id="email"/>
                                                </div>

                                                <div class="field input-field">
                                                    <input type="password" placeholder="Password" class="password" id="password"/>
                                                </div>

                                                <div class="field button-field">
                                                    <button type="button" class="btn btn-primary btn-lg" onclick="signUp();">
                                                        Sign up
                                                    </button>
                                                </div>
                                            </form>

                                            <div class="form-link">
                                                <span>Already have an account? <a href="sign-in.html" class="link login-link">Login</a></span>
                                            </div>
                                        </div>

                                        <div class="line"></div>

                                        <div class="media-options">
                                            <a href="#" class="field facebook">
                                                <i class='bx bxl-facebook facebook-icon'></i>
                                                <span>Login with Facebook</span>
                                            </a>
                                        </div>

                                        <div class="media-options mt-2">
                                            <div id="g_id_onload"
                                                 data-client_id="21116436869-tv31dl98l8rm242h1oksampg32b65jni.apps.googleusercontent.com"
                                                 data-login_uri="http://localhost/oneplus/home.php"
                                                 data-auto_prompt="false">
                                            </div>
                                            <div class="g_id_signin"
                                                 data-type="standard"
                                                 data-shape="rectangular"
                                                 data-theme="outline"
                                                 data-text="signin_with"
                                                 data-size="large"
                                                 data-logo_alignment="left">
                                            </div>

                                        </div>

                                    </div>

                                </section>

                            </section>

                        </div>
                    </div>
                </div>

            </div>
            <!-- Jumbotron -->
        </section>
    </div>
</div>

<script src="assets/js/sign-up.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/vendor/bootstrap.min.js"></script>

</body>
</html>
