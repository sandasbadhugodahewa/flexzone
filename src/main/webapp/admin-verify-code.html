<div class="auth-layout">
    <div class="auth-container">
        <a href="https://bootstrapmade.com/content/demo/EliteAdmin/index.html" class="auth-logo">
            <img src="https://bootstrapmade.com/content/demo/EliteAdmin/assets/img/logo.webp" alt="EliteAdmin">
            <span>FleXZone</span>
        </a>

        <div class="auth-card">
            <div class="auth-card-header">
                <div class="auth-icon">
                    <i class="bi bi-key"></i>
                </div>
                <h1 class="auth-title">Admin Verification</h1>
                <p class="auth-subtitle">We'll send you reset instructions.</p>
            </div>

            <form class="auth-form" novalidate>
                <div class="form-group">
                    <label for="vCode" class="form-label">Verification Code</label>
                    <input type="text" class="form-control" id="vCode" name="email" required>
                </div>

                <button type="button" class="btn btn-primary btn-block"
                        onclick="verifyAdminOtp();">Verify OTP</button>
            </form>

            <p class="auth-footer-text">
                <a href="admin-login.html" class="auth-link">
                    <i class="bi bi-arrow-left"></i> Back to login
                </a>
            </p>
        </div>

        <footer class="footer-centered">
            <div class="footer-copyright">
                &copy; 2026 <a href="#">FlexZone</a>. All Rights Reserved.
            </div>
        </footer>
    </div>
</div>
