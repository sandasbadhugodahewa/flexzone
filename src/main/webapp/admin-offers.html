		.main { display:none; }
		.offer-badge { font-weight:600; }

<body>

<div id="sidebar"></div>

<!-- Main Content -->
<main class="main">
	<div class="main-content page-offers">
		<!-- Page Header -->
		<div class="page-header">
			<div>
				<h1 class="page-title">Offers</h1>
				<nav class="breadcrumb">
					<a href="index.html" class="breadcrumb-item">Home</a>
					<span class="breadcrumb-item active">Offers</span>
				</nav>
			</div>
			<div class="page-header-actions">
				<button class="btn btn-outline-secondary"><i class="bi bi-download me-1"></i> Export</button>
				<button class="btn btn-primary btn-block" data-bs-toggle="modal" data-bs-target="#offerModal">
					<i class="bi bi-plus-lg me-1"></i> Add Offer
				</button>
			</div>
		</div>

		<!-- Stats -->
		<div class="row g-3 mb-4">
			<div class="col-6 col-lg-3">
				<div class="users-stat-card">
					<div class="users-stat-icon" style="background: var(--accent-color-light); color:var(--accent-color);">
						<i class="bi bi-tag"></i>
					</div>
					<div class="users-stat-info">
						<span class="users-stat-value" id="totalOffers">0</span>
						<span class="users-stat-label">Total Offers</span>
					</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="users-stat-card">
					<div class="users-stat-icon" style="background: var(--success-color-light); color: var(--success-color);">
						<i class="bi bi-clock-history"></i>
					</div>
					<div class="users-stat-info">
						<span class="users-stat-value" id="activeOffers">0</span>
						<span class="users-stat-label">Active</span>
					</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="users-stat-card">
					<div class="users-stat-icon" style="background: var(--warning-color-light); color: var(--warning-color);">
						<i class="bi bi-calendar2-week"></i>
					</div>
					<div class="users-stat-info">
						<span class="users-stat-value" id="upcomingOffers">0</span>
						<span class="users-stat-label">Upcoming</span>
					</div>
				</div>
			</div>
			<div class="col-6 col-lg-3">
				<div class="users-stat-card">
					<div class="users-stat-icon" style="background: var(--danger-color-light); color: var(--danger-color);">
						<i class="bi bi-clock-x"></i>
					</div>
					<div class="users-stat-info">
						<span class="users-stat-value" id="expiredOffers">0</span>
						<span class="users-stat-label">Expired</span>
					</div>
				</div>
			</div>
		</div>

		<!-- Offers Card -->
		<div class="card">
			<div class="users-toolbar offers-toolbar p-3">
				<div class="d-flex align-items-center gap-3">
					<div class="users-filter-tabs">
						<button class="users-filter-tab active" data-filter="all">All <span class="users-filter-count" id="allOfferCount">0</span></button>
						<button class="users-filter-tab" data-filter="active">Active <span class="users-filter-count" id="activeOfferCount">0</span></button>
						<button class="users-filter-tab" data-filter="upcoming">Upcoming <span class="users-filter-count" id="upcomingOfferCount">0</span></button>
						<button class="users-filter-tab" data-filter="expired">Expired <span class="users-filter-count" id="expiredOfferCount">0</span></button>
					</div>
				</div>
				<div class="ms-auto d-flex align-items-center">
					<div class="users-search me-3">
						<i class="bi bi-search"></i>
						<input type="text" id="offerSearchInput" placeholder="Search offers..." autocomplete="off">
					</div>
					<div>
						<button class="btn btn-outline-secondary" id="bulkDeleteBtn"><i class="bi bi-trash"></i> Delete</button>
					</div>
				</div>
			</div>

			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead>
					<tr>
						<th>#</th>
						<th>Title</th>
						<th>Type</th>
						<th>Value</th>
						<th>Applies To</th>
						<th>Start</th>
						<th>End</th>
						<th>Status</th>
						<th class="users-th-actions">Actions</th>
					</tr>
					</thead>
					<tbody id="offersTableBody">
					<!-- Offers list populated by admin-offers.js -->
					</tbody>
				</table>
			</div>

			<div class="users-pagination p-3">
				<div class="users-pagination-info">Showing <strong>1-10</strong> of <strong id="offersTotal">0</strong> offers</div>
				<nav>
					<ul class="pagination pagination-sm mb-0">
						<li class="page-item disabled"><a class="page-link" href="#"><i class="bi bi-chevron-left"></i></a></li>
						<li class="page-item active"><a class="page-link" href="#">1</a></li>
						<li class="page-item"><a class="page-link" href="#">2</a></li>
						<li class="page-item"><a class="page-link" href="#">3</a></li>
						<li class="page-item"><a class="page-link" href="#">...</a></li>
						<li class="page-item"><a class="page-link" href="#">10</a></li>
						<li class="page-item"><a class="page-link" href="#"><i class="bi bi-chevron-right"></i></a></li>
					</ul>
				</nav>
			</div>
		</div>

	</div>

	<!-- Footer -->
	<footer class="footer">
		<div class="footer-content">
			<div class="footer-links">
				<a href="#">About</a>
				<span class="footer-separator"></span>
				<a href="#">Privacy</a>
				<span class="footer-separator"></span>
				<a href="#">Terms</a>
				<span class="footer-separator"></span>
				<a href="#">Contact</a>
			</div>
			<div class="footer-copyright">&copy; 2026 <a href="#">FlexZone</a></div>
		</div>
	</footer>
</main>

<!-- Offer Modal -->
<div class="modal fade" id="offerModal" tabindex="-1" aria-hidden="true">
	<div class="modal-dialog modal-lg modal-dialog-centered">
		<div class="modal-content">
			<div class="modal-header">
				<h5 class="modal-title">Create Offer</h5>
				<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			</div>
			<div class="modal-body">
				<form id="offerForm">
					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Title</label>
							<input type="text" class="form-control" id="offerTitle" required>
						</div>
						<div class="col-md-3">
							<label class="form-label">Type</label>
							<select class="form-select" id="offerType">
								<option value="percentage">Percentage</option>
								<option value="fixed">Fixed Amount</option>
							</select>
						</div>
						<div class="col-md-3">
							<label class="form-label">Value</label>
							<input type="number" class="form-control" id="offerValue" min="0" required>
						</div>
						<div class="col-md-6">
							<label class="form-label">Applies To</label>
							<select class="form-select" id="offerScope">
								<option value="all">All Products</option>
								<option value="category">Category</option>
								<option value="product">Specific Products</option>
							</select>
						</div>
						<div class="col-md-3">
							<label class="form-label">Start Date</label>
							<input type="date" class="form-control" id="offerStart">
						</div>
						<div class="col-md-3">
							<label class="form-label">End Date</label>
							<input type="date" class="form-control" id="offerEnd">
						</div>
						<div class="col-12">
							<label class="form-label">Description</label>
							<textarea class="form-control" id="offerDescription" rows="3"></textarea>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				<button type="button" class="btn btn-primary" id="saveOfferBtn">Save Offer</button>
			</div>
		</div>
	</div>
</div>
