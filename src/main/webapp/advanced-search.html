<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Advanced Search - fleXZone</title>
    <meta name="robots" content="noindex, nofollow">

    <link href="assets/images/logo/favicon.ico" rel="icon">


    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/" rel="preconnect">
    <link href="https://fonts.gstatic.com/" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Vendor CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/css/bootstrap-icons.min.css" rel="stylesheet">
    <link href="assets/css/swiper-bundle.min.css" rel="stylesheet">
    <link href="assets/css/aos.css" rel="stylesheet">
    <link href="assets/css/main.css" rel="stylesheet">
    <link href="assets/css/advanced-search.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <script>
        fetch("header.html").then(r => r.text()).then(d => { document.getElementById("header").innerHTML = d; });
        fetch("footer.html").then(r => r.text()).then(d => { document.getElementById("footer").innerHTML = d; });
    </script>
</head>

<body>
<div id="header"></div>

<main class="main">

    <!-- Page Title -->
    <div class="page-title light-background">
        <div class="container d-lg-flex justify-content-between align-items-center">
            <h1 class="mb-2 mb-lg-0">Advanced Search</h1>
            <nav class="breadcrumbs">
                <ol>
                    <li><a href="index.html">Home</a></li>
                    <li class="current">Advanced Search</li>
                </ol>
            </nav>
        </div>
    </div>

    <div class="container">
        <div class="as-layout">

            <aside class="as-sidebar">
                <div id="asSidebarContent">
                    <!-- skeleton -->
                    <div class="as-filter-card">
                        <div class="as-skeleton" style="height:16px;width:60%;margin-bottom:14px;"></div>
                        <div class="as-skeleton" style="height:36px;margin-bottom:8px;"></div>
                        <div class="as-skeleton" style="height:36px;margin-bottom:8px;"></div>
                        <div class="as-skeleton" style="height:36px;"></div>
                    </div>
                    <div class="as-filter-card">
                        <div class="as-skeleton" style="height:16px;width:50%;margin-bottom:14px;"></div>
                        <div class="as-skeleton" style="height:28px;border-radius:999px;"></div>
                    </div>
                </div>
            </aside>

            <div class="as-main">

                <!-- Mobile filter button -->
                <button class="as-mobile-filter-btn" onclick="openAsDrawer()">
                    <i class="bi bi-funnel"></i> Filters
                </button>

                <!-- Active filter tags -->
                <div class="as-active-filters" id="asActiveFilters"></div>

                <!-- Toolbar -->
                <div class="as-toolbar">
                    <div class="as-toolbar-left">
                        Showing <strong id="asProductCount">—</strong> products
                    </div>
                    <div class="as-toolbar-right">
                        <div class="as-search-wrap">
                            <input type="text" id="asKeyword" placeholder="Search products..."
                                   oninput="onKeywordInput(this.value)">
                            <i class="bi bi-search"></i>
                        </div>
                        <select class="as-sort-select" id="asSortSelect" onchange="runSearch()">
                            <option value="default">Default</option>
                            <option value="price-asc">Price: Low → High</option>
                            <option value="price-desc">Price: High → Low</option>
                            <option value="name-asc">Name: A–Z</option>
                            <option value="name-desc">Name: Z–A</option>
                            <option value="newest">Newest</option>
                        </select>
                        <button class="as-view-btn active" id="asGridBtn"
                                onclick="setAsView('grid')" title="Grid view">
                            <i class="bi bi-grid"></i>
                        </button>
                    </div>
                </div>

                <!-- Product Grid -->
                <div class="row g-3 as-product-grid" id="asProductGrid">
                    <!-- skeleton -->
                    <div class="col-md-6 col-lg-4">
                        <div class="as-skeleton" style="height:320px;border-radius:14px;"></div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="as-skeleton" style="height:320px;border-radius:14px;"></div>
                    </div>
                    <div class="col-md-6 col-lg-4">
                        <div class="as-skeleton" style="height:320px;border-radius:14px;"></div>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination-wrapper" id="asPaginationContainer" style="display:none;">
                    <button type="button" class="btn-prev" disabled>
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <div class="page-numbers"></div>
                    <button type="button" class="btn-next">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>

            </div>
        </div>
    </div>

</main>

<!-- Mobile -->
<div class="as-sidebar-overlay" id="asOverlay" onclick="closeAsDrawer()"></div>
<div class="as-sidebar-drawer" id="asDrawer">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Filters</h5>
        <button class="btn btn-sm btn-outline-secondary" onclick="closeAsDrawer()">
            <i class="bi bi-x-lg"></i>
        </button>
    </div>
    <div id="asDrawerContent"></div>
</div>

<div id="footer"></div>

<a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center">
    <i class="bi bi-arrow-up-short"></i>
</a>
<div id="preloader"></div>

<!-- Vendor JS -->
<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/vendor/swiper-bundle.min.js"></script>
<script src="assets/js/vendor/aos.js"></script>
<script src="assets/js/notiflix-aio-3.2.8.min.js"></script>
<script src="assets/js/vendor/main.js"></script>
<script src="assets/js/header.js"></script>
<script src="assets/js/cart.js"></script>
<script src="assets/js/wishlist.js"></script>
<script src="assets/js/advanced-search.js"></script>

</body>
